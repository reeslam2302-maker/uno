<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онлайн UNO</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at center, #1b5e20 0%, #0a290d 100%);
            color: white; margin: 0; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            user-select: none; overflow: hidden;
        }

        #loginScreen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; padding: 20px; text-align: center;
        }
        .uno-logo {
            font-size: 54px; font-weight: 900; color: #ffeb3b;
            text-shadow: 4px 4px 0 #d32f2f, -2px -2px 0 #000;
            transform: rotate(-6deg); margin-bottom: 20px;
        }
        #loginScreen input {
            padding: 14px; font-size: 18px; border-radius: 12px; border: none;
            margin-bottom: 15px; text-align: center; width: 260px;
        }
        .btn-main {
            padding: 13px 26px; font-size: 17px; font-weight: bold; border: none;
            border-radius: 12px; background: #ff9800; color: #000; cursor: pointer;
            margin: 5px; box-shadow: 0 4px 0 #b26a00;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b26a00; }
        .btn-reconnect { background: #00e676; box-shadow: 0 4px 0 #00a152; animation: pulse 1.5s infinite; }

        .top-bar { width: 100%; padding: 8px; display: flex; flex-direction: column; align-items: center; }
        .players-scroll {
            display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 4px;
            scrollbar-width: none;
        }
        .players-scroll::-webkit-scrollbar { display: none; }
        .player-card {
            background: rgba(0,0,0,0.55); padding: 6px 12px; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15); min-width: 95px; text-align: center;
            font-size: 13px; flex-shrink: 0; position: relative;
        }
        .player-card.active {
            border-color: #ffeb3b; background: rgba(255, 235, 59, 0.25);
            box-shadow: 0 0 12px rgba(255, 235, 59, 0.6);
        }
        .uno-badge {
            background: #f44336; color: white; padding: 1px 5px; border-radius: 4px;
            font-size: 11px; font-weight: bold;
        }
        .catch-btn {
            display: block; margin: 4px auto 0; background: #ff1744; color: white;
            border: 1px solid white; border-radius: 6px; font-size: 11px; font-weight: bold;
            padding: 3px 6px; cursor: pointer; animation: pulse 0.8s infinite;
        }

        .lobby-box {
            background: rgba(0,0,0,0.65); padding: 15px; border-radius: 16px;
            max-width: 420px; width: 92%; margin-top: 10px; text-align: left;
        }
        .lobby-box h3 { margin: 0 0 10px; text-align: center; color: #ffeb3b; }
        .setting-row {
            display: flex; align-items: center; gap: 10px; margin: 8px 0;
            font-size: 14px; cursor: pointer;
        }
        .setting-row input { width: 18px; height: 18px; accent-color: #ff9800; }
        .lobby-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }

        .center-area { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .status-pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 13px; }
        .pill { background: rgba(0,0,0,0.45); padding: 4px 10px; border-radius: 12px; }
        .penalty-pill { background: #d32f2f; font-weight: bold; animation: pulse 1s infinite; }

        .table { display: flex; align-items: center; gap: 22px; margin: 4px 0; }
        .uno-card {
            width: 78px; height: 116px; border-radius: 12px; background: #111;
            border: 4px solid #fff; box-shadow: 0 6px 14px rgba(0,0,0,0.6);
            position: relative; display: flex; align-items: center; justify-content: center;
            font-weight: 900; overflow: hidden; flex-shrink: 0; transition: transform 0.15s;
        }
        .uno-card::before {
            content: ''; position: absolute; width: 88%; height: 68%;
            background: rgba(255,255,255,0.92); border-radius: 50%;
            transform: rotate(-28deg);
        }
        .card-center {
            position: relative; z-index: 2; font-size: 32px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
        }
        .card-corner {
            position: absolute; z-index: 2; font-size: 14px; color: #fff;
            text-shadow: 1px 1px 0 #000;
        }
        .top-left { top: 4px; left: 6px; }
        .bottom-right { bottom: 4px; right: 6px; transform: rotate(180deg); }

        .red { background: #e53935; } .red .card-center { color: #e53935; }
        .blue { background: #1e88e5; } .blue .card-center { color: #1e88e5; }
        .green { background: #43a047; } .green .card-center { color: #43a047; }
        .yellow { background: #fdd835; } .yellow .card-center { color: #fbc02d; }
        .black { background: #212121; } .black .card-center { color: #212121; text-shadow: none; }

        .deck-back { background: #111; cursor: pointer; }
        .deck-back::before { background: #e53935; }
        .deck-back .card-center {
            color: #ffeb3b; font-size: 20px; transform: rotate(-20deg);
            text-shadow: 2px 2px 0 #000;
        }

        .social-panel {
            width: 96%; max-width: 480px; background: rgba(0,0,0,0.5);
            border-radius: 12px; padding: 6px 10px; margin: 0 auto;
        }
        #chatLog {
            height: 48px; overflow-y: auto; font-size: 12px; margin-bottom: 5px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .sticker-controls { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; overflow-x: auto; }
        .sticker-controls select {
            background: #222; color: #ffeb3b; border: 1px solid #555;
            border-radius: 6px; padding: 4px; font-size: 12px;
        }
        .st-btn {
            background: rgba(255,255,255,0.15); border: none; border-radius: 6px;
            padding: 4px 7px; font-size: 14px; cursor: pointer; color: white; flex-shrink: 0;
        }
        .chat-row { display: flex; gap: 5px; }
        .chat-row input { flex: 1; padding: 5px 8px; border-radius: 6px; border: none; font-size: 13px; }
        .chat-row button { background: #4caf50; color: white; border: none; border-radius: 6px; padding: 0 12px; font-weight: bold; }

        .bottom-area { width: 100%; padding-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
        #unoBtn {
            background: linear-gradient(45deg, #ff1744, #ff9100); color: white;
            border: 3px solid white; border-radius: 30px; padding: 7px 26px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-bottom: 8px;
        }
        #unoBtn:disabled { background: #444; opacity: 0.4; cursor: not-allowed; }
        .hand-container {
            display: flex; justify-content: center; align-items: flex-end;
            width: 100%; height: 125px; padding: 0 10px;
        }
        .hand-container .uno-card { cursor: pointer; }
        .hand-container .uno-card:hover { transform: translateY(-16px) !important; z-index: 50 !important; }

        #stickerPopup {
            display: none; position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.88); border: 3px solid #ffeb3b; border-radius: 20px;
            padding: 18px 30px; text-align: center; z-index: 150; pointer-events: none;
            animation: popIn 0.3s ease-out;
        }
        #stickerPopup .big-emoji { font-size: 64px; }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            align-items: center; justify-content: center; flex-direction: column; z-index: 180; padding: 20px;
        }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .c-pick { width: 75px; height: 75px; border-radius: 50%; border: 4px solid white; cursor: pointer; }

        .sound-toggle {
            position: fixed; top: 8px; right: 8px; background: rgba(0,0,0,0.5);
            border: 1px solid #fff; color: #fff; border-radius: 50%; width: 34px; height: 34px;
            font-size: 16px; cursor: pointer; z-index: 90;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0.4); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
</head>
<body>

    <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>

    <div id="loginScreen">
        <div class="uno-logo">UNO</div>
        <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="15">
        <button class="btn-main" onclick="joinOnline()">🌐 Войти в онлайн-стол</button>
        <button class="btn-main btn-reconnect" id="reconnectBtn" style="display:none;" onclick="joinOnline(true)">
            🔄 Вернуться в активную игру
        </button>
    </div>

    <div class="top-bar">
        <div class="players-scroll" id="playersList"></div>

        <div class="lobby-box" id="lobbyBox" style="display:none;">
            <h3>Настройки правил перед раздачей</h3>
            <label class="setting-row">
                <input type="checkbox" id="optIntercept" onchange="syncSettings()">
                <span>⚡ <b>Перехват</b> (скинуть точную копию карты вне очереди)</span>
            </label>
            <label class="setting-row">
                <input type="checkbox" id="optStacking" onchange="syncSettings()">
                <span>🔥 <b>Перекидывание +2 / +4</b> (накопление штрафа)</span>
            </label>
            <label class="setting-row">
                <input type="checkbox" id="optTimer" onchange="syncSettings()">
                <span>⏱️ <b>Таймер 15 сек</b> на ход (авто-добор при истечении)</span>
            </label>
            <label class="setting-row">
                <input type="checkbox" id="optCatchUno" onchange="syncSettings()">
                <span>👀 <b>Кнопка «Поймать!»</b> (штраф за забытое УНО)</span>
            </label>

            <div class="lobby-actions">
                <button class="btn-main" style="background:#90caf9;" onclick="socket.emit('addBot')">+ Бот 🤖</button>
                <button class="btn-main" style="background:#ef9a9a;" onclick="socket.emit('removeBots')">Убрать ботов</button>
                <button class="btn-main" id="startBtn" style="display:none; background:#00e676;" onclick="socket.emit('startGame')">Начать игру!</button>
            </div>
        </div>
    </div>

    <div class="center-area" id="gameTable" style="display:none;">
        <div class="status-pills">
            <span class="pill" id="roundPill">Раунд 1 (до 250)</span>
            <span class="pill" id="dirPill">➡️ По часовой</span>
            <span class="pill" id="timerPill" style="display:none;">⏱️ 15с</span>
            <span class="pill penalty-pill" id="penaltyPill" style="display:none;">Штраф: +0</span>
        </div>

        <div class="table">
            <div class="uno-card deck-back" onclick="drawCard()">
                <div class="card-center">UNO</div>
            </div>
            <div id="topCardSlot"></div>
        </div>
    </div>

    <div class="social-panel" id="socialPanel" style="display:none;">
        <div id="chatLog"></div>
        <div class="sticker-controls">
            <select id="stickerTarget">
                <option value="all">Кому: Всем</option>
            </select>
            <button class="st-btn" onclick="sendSticker('🤡', 'Клоун!')">🤡</button>
            <button class="st-btn" onclick="sendSticker('😭', 'Поплачь!')">😭</button>
            <button class="st-btn" onclick="sendSticker('🐌', 'Ну и тормоз!')">🐌</button>
            <button class="st-btn" onclick="sendSticker('💀', 'Тебе конец!')">💀</button>
            <button class="st-btn" onclick="sendSticker('🥱', 'Скучно...')">🥱</button>
            <button class="st-btn" onclick="sendSticker('😂', 'Ха-ха!')">😂</button>
        </div>
        <div class="chat-row">
            <input type="text" id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">OK</button>
        </div>
    </div>

    <div class="bottom-area" id="bottomArea" style="display:none;">
        <button id="unoBtn" onclick="socket.emit('sayUno')" disabled>КРИКНУТЬ УНО!</button>
        <div class="hand-container" id="hand"></div>
    </div>

    <div id="stickerPopup">
        <div class="big-emoji" id="stEmoji">🤡</div>
        <div id="stSender" style="font-size:13px; color:#ffeb3b; margin-top:5px;"></div>
        <div id="stText" style="font-size:20px; font-weight:bold;"></div>
    </div>

    <div class="modal" id="colorModal">
        <h2>Выберите новый цвет:</h2>
        <div class="color-grid">
            <div class="c-pick red" onclick="pickColor('red')"></div>
            <div class="c-pick blue" onclick="pickColor('blue')"></div>
            <div class="c-pick green" onclick="pickColor('green')"></div>
            <div class="c-pick yellow" onclick="pickColor('yellow')"></div>
        </div>
    </div>

    <div class="modal" id="scoreModal">
        <h2 id="scoreTitle">Итоги раунда</h2>
        <div id="scoreList" style="font-size:18px; line-height:1.7; margin:15px 0;"></div>
        <button class="btn-main" id="closeScoreBtn" style="display:none;" onclick="location.reload()">В главное меню</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUid = localStorage.getItem('uno_uid');
        if (!myUid) {
            myUid = 'u_' + Math.random().toString(36).slice(2) + Date.now();
            localStorage.setItem('uno_uid', myUid);
        }

        const savedName = localStorage.getItem('uno_name');
        if (savedName) document.getElementById('nameInput').value = savedName;

        let isMyTurn = false;
        let pendingWildIdx = null;
        let soundEnabled = true;
        let stickerTimer = null;

        const audioFiles = {
            plus2: new Audio('/plus2.mp3'),
            plus4: new Audio('/plus4.mp3'),
            uno: new Audio('/uno.mp3'),
            wild: new Audio('/wild.mp3')
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, dur) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        socket.on('playSound', (type) => {
            if (!soundEnabled) return;
            if (audioFiles[type]) {
                audioFiles[type].currentTime = 0;
                audioFiles[type].play().catch(() => {});
            } else if (type === 'card') {
                playBeep(320, 0.08);
            } else if (type === 'win') {
                playBeep(523, 0.15);
                setTimeout(() => playBeep(659, 0.15), 150);
                setTimeout(() => playBeep(784, 0.3), 300);
            }
        });

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        socket.on('connect', () => {
            socket.emit('checkReconnect', myUid);
        });

        socket.on('reconnectAvailable', (data) => {
            const btn = document.getElementById('reconnectBtn');
            if (data.available) {
                btn.style.display = 'inline-block';
                btn.innerText = `🔄 Вернуться в игру (${data.name})`;
            } else {
                btn.style.display = 'none';
            }
        });

        function joinOnline(isReconnect = false) {
            Object.values(audioFiles).forEach(a => { a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {}); });
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const name = document.getElementById('nameInput').value.trim();
            if (name) localStorage.setItem('uno_name', name);

            socket.emit('joinGame', { uid: myUid, name });
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('socialPanel').style.display = 'block';
        }

        function syncSettings() {
            socket.emit('updateSettings', {
                intercept: document.getElementById('optIntercept').checked,
                stacking: document.getElementById('optStacking').checked,
                timer: document.getElementById('optTimer').checked,
                catchUno: document.getElementById('optCatchUno').checked
            });
        }

        socket.on('timerTick', (sec) => {
            const pill = document.getElementById('timerPill');
            pill.style.display = 'inline-block';
            pill.innerText = `⏱️ ${sec}с`;
            pill.style.background = sec <= 5 ? '#d32f2f' : 'rgba(0,0,0,0.45)';
        });

        socket.on('gameState', (state) => {
            const wasMyTurn = isMyTurn;
            isMyTurn = state.isMyTurn;
            if (!wasMyTurn && isMyTurn) playBeep(580, 0.12);

            const pList = document.getElementById('playersList');
            const targetSelect = document.getElementById('stickerTarget');
            const prevTarget = targetSelect.value;

            pList.innerHTML = '';
            targetSelect.innerHTML = '<option value="all">Кому: Всем</option>';

            state.playersList.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-card' + (p.isTurn ? ' active' : '');
                div.innerHTML = `
                    <div><b>${p.name}${p.isMe ? ' (Вы)' : ''}</b></div>
                    <div>Карт: <b>${p.count}</b> | Очки: ${p.score}</div>
                    ${p.autopilot ? '<div style="color:#ff9800;font-size:11px;">🤖 Автопилот</div>' : ''}
                    ${p.saidUno ? '<span class="uno-badge">УНО!</span>' : ''}
                    ${p.canBeCaught ? `<button class="catch-btn" onclick="socket.emit('catchUno', '${p.uid}')">👀 ПОЙМАТЬ!</button>` : ''}
                `;
                pList.appendChild(div);

                if (!p.isMe && !p.isBot) {
                    const opt = document.createElement('option');
                    opt.value = p.uid;
                    opt.innerText = `Для: ${p.name}`;
                    targetSelect.appendChild(opt);
                }
            });
            targetSelect.value = prevTarget || 'all';

            if (!state.gameStarted) {
                document.getElementById('lobbyBox').style.display = 'block';
                document.getElementById('gameTable').style.display = 'none';
                document.getElementById('bottomArea').style.display = 'none';
                document.getElementById('startBtn').style.display = state.playersList.length >= 2 ? 'inline-block' : 'none';

                document.getElementById('optIntercept').checked = state.settings.intercept;
                document.getElementById('optStacking').checked = state.settings.stacking;
                document.getElementById('optTimer').checked = state.settings.timer;
                document.getElementById('optCatchUno').checked = state.settings.catchUno;
                return;
            }

            document.getElementById('lobbyBox').style.display = 'none';
            document.getElementById('gameTable').style.display = 'flex';
            document.getElementById('bottomArea').style.display = 'flex';

            document.getElementById('roundPill').innerText = `Раунд ${state.roundNumber} (до 250)`;
            document.getElementById('dirPill').innerText = state.direction === 1 ? '➡️ По часовой' : '⬅️ Против часовой';
            document.getElementById('timerPill').style.display = state.settings.timer ? 'inline-block' : 'none';

            const penPill = document.getElementById('penaltyPill');
            if (state.pendingPenalty > 0) {
                penPill.style.display = 'inline-block';
                penPill.innerText = `Накоплено: +${state.pendingPenalty}`;
            } else {
                penPill.style.display = 'none';
            }

            document.getElementById('topCardSlot').innerHTML = renderCardHTML(state.currentCard);

            const unoBtn = document.getElementById('unoBtn');
            unoBtn.disabled = !(state.hand.length <= 2 && !state.saidUno);
            unoBtn.innerText = state.saidUno ? 'УНО СКАЗАНО!' : 'КРИКНУТЬ УНО!';

            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            const count = state.hand.length;
            const maxSpread = Math.min(window.innerWidth - 30, count * 52);
            const step = count > 1 ? Math.min(48, (maxSpread - 78) / (count - 1)) : 0;

            state.hand.forEach((card, idx) => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = renderCardHTML(card);
                const el = wrapper.firstElementChild;
                if (idx > 0) el.style.marginLeft = `${step - 78}px`;

                el.onclick = () => {
                    if (card.color === 'black') {
                        if (!isMyTurn) return;
                        pendingWildIdx = idx;
                        document.getElementById('colorModal').style.display = 'flex';
                    } else {
                        socket.emit('playCard', { cardIndex: idx });
                    }
                };
                handDiv.appendChild(el);
            });
        });

        function renderCardHTML(card) {
            return `
                <div class="uno-card ${card.color}">
                    <span class="card-corner top-left">${card.value}</span>
                    <div class="card-center">${card.value}</div>
                    <span class="card-corner bottom-right">${card.value}</span>
                </div>
            `;
        }

        function pickColor(color) {
            document.getElementById('colorModal').style.display = 'none';
            if (pendingWildIdx !== null) {
                socket.emit('playCard', { cardIndex: pendingWildIdx, chosenColor: color });
                pendingWildIdx = null;
            }
        }

        function drawCard() {
            if (isMyTurn) socket.emit('drawCard');
        }

        function sendChat() {
            const inp = document.getElementById('chatInput');
            if (inp.value.trim()) {
                socket.emit('sendChat', inp.value);
                inp.value = '';
            }
        }

        function sendSticker(emoji, text) {
            const targetUid = document.getElementById('stickerTarget').value;
            socket.emit('sendSticker', { targetUid, emoji, text });
        }

        socket.on('showSticker', (data) => {
            const pop = document.getElementById('stickerPopup');
            document.getElementById('stEmoji').innerText = data.emoji;
            document.getElementById('stSender').innerText = data.isPrivate
                ? `Лично вам от ${data.sender}:`
                : `От ${data.sender} для всех:`;
            document.getElementById('stText').innerText = data.text;
            pop.style.display = 'block';
            clearTimeout(stickerTimer);
            stickerTimer = setTimeout(() => { pop.style.display = 'none'; }, 2800);
        });

        socket.on('chatMessage', (msg) => {
            const log = document.getElementById('chatLog');
            const row = document.createElement('div');
            row.innerHTML = msg.isSystem
                ? `<span style="color:#ffeb3b">${msg.text}</span>`
                : `<b>${msg.sender}:</b> ${msg.text}`;
            log.appendChild(row);
            log.scrollTop = log.scrollHeight;
        });

        socket.on('roundOver', (data) => {
            const modal = document.getElementById('scoreModal');
            document.getElementById('scoreTitle').innerText = `Раунд ${data.roundNumber} выиграл ${data.winnerName} (+${data.earnedPoints} очков)!`;
            document.getElementById('scoreList').innerHTML = data.scoreboard
                .map((p, i) => `${i + 1}. <b>${p.name}</b> — ${p.score} / 250 очков`).join('<br>');
            document.getElementById('closeScoreBtn').style.display = 'none';
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.display = 'none'; }, 4800);
        });

        socket.on('matchOver', (data) => {
            const modal = document.getElementById('scoreModal');
            document.getElementById('scoreTitle').innerText = `🏆 ПОБЕДИТЕЛЬ МАТЧА: ${data.winnerName}!`;
            document.getElementById('scoreList').innerHTML = data.scoreboard
                .map((p, i) => `${i + 1}. <b>${p.name}</b> — ${p.score} очков`).join('<br>');
            document.getElementById('closeScoreBtn').style.display = 'inline-block';
            modal.style.display = 'flex';
        });

        socket.on('alertMsg', (msg) => alert(msg));
        socket.on('errorMsg', (msg) => { alert(msg); location.reload(); });
    </script>
</body>
</html>
