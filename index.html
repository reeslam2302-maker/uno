<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Online (до 250 очков)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1b5e20 0%, #0a290d 100%);
            color: white; margin: 0; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            user-select: none; overflow: hidden;
        }

        /* Плашка переподключения */
        #reconnectBanner {
            display: none; position: fixed; top: 0; left: 0; right: 0;
            background: #e67e22; color: #fff; text-align: center;
            padding: 6px; font-size: 13px; font-weight: bold; z-index: 300;
        }

        /* Кнопка звука */
        #soundToggle {
            position: fixed; top: 8px; right: 8px; z-index: 90;
            background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 50%; width: 36px; height: 36px;
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Экран входа */
        #loginScreen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px;
        }
        .uno-logo-title {
            font-size: 54px; font-weight: 900; color: #f1c40f;
            text-shadow: 4px 4px 0 #e74c3c, -2px -2px 0 #000;
            transform: rotate(-8deg); margin-bottom: 20px; letter-spacing: 2px;
        }
        #loginScreen input {
            padding: 14px; font-size: 18px; border-radius: 10px; border: none;
            margin-bottom: 15px; text-align: center; width: 260px;
        }
        .btn-main {
            padding: 14px 32px; font-size: 18px; font-weight: bold; border: none;
            border-radius: 10px; background: linear-gradient(180deg, #f1c40f, #f39c12);
            color: #111; cursor: pointer; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }

        /* Верхняя панель игроков */
        .top-bar { width: 100%; padding: 8px 46px 4px 8px; display: flex; flex-direction: column; align-items: center; }
        .round-info { font-size: 12px; color: #f1c40f; font-weight: bold; margin-bottom: 4px; }
        .players-list {
            display: flex; gap: 8px; overflow-x: auto; width: 100%;
            padding: 4px; justify-content: flex-start; scrollbar-width: none;
        }
        .players-list::-webkit-scrollbar { display: none; }
        @media (min-width: 768px) { .players-list { justify-content: center; } }

        .player-badge {
            flex: 0 0 auto; background: rgba(0,0,0,0.55); padding: 6px 10px;
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.15);
            text-align: center; font-size: 12px; min-width: 85px; transition: opacity 0.3s;
        }
        .player-badge.active-turn {
            border-color: #f1c40f; background: rgba(241, 196, 15, 0.25);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .player-badge.offline { opacity: 0.45; border-style: dashed; }
        .uno-tag { background: #e74c3c; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        /* Игровой стол */
        .center-area { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: auto 0; }
        .direction-indicator {
            font-size: 12px; background: rgba(0,0,0,0.4); padding: 3px 12px; border-radius: 12px;
        }
        .table { display: flex; align-items: center; gap: 20px; }

        /* ОРИГИНАЛЬНЫЙ СКИН КАРТ UNO */
        .uno-card {
            width: 78px; height: 116px; border-radius: 11px;
            background: #fff; padding: 5px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.55);
            position: relative; flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .card-inner {
            width: 100%; height: 100%; border-radius: 7px;
            position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .card-oval {
            width: 86%; height: 72%; background: #fff;
            border-radius: 50%; transform: rotate(-28deg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
        }
        .card-center-val {
            transform: rotate(28deg); font-size: 32px; font-weight: 900;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
        }
        .corner-top, .corner-bottom {
            position: absolute; font-size: 13px; font-weight: 900;
            color: #fff; text-shadow: 1px 1px 0 #000; line-height: 1;
        }
        .corner-top { top: 4px; left: 5px; }
        .corner-bottom { bottom: 4px; right: 5px; transform: rotate(180deg); }

        .bg-red { background: #d32f2f; } .txt-red { color: #d32f2f; }
        .bg-blue { background: #1976d2; } .txt-blue { color: #1976d2; }
        .bg-green { background: #388e3c; } .txt-green { color: #388e3c; }
        .bg-yellow { background: #fbc02d; } .txt-yellow { color: #fbc02d; }
        .bg-black { background: #212121; } .txt-black { color: #212121; }

        .wild-oval {
            background: conic-gradient(#d32f2f 0deg 90deg, #1976d2 90deg 180deg, #fbc02d 180deg 270deg, #388e3c 270deg 360deg);
        }
        .wild-oval .card-center-val { color: #fff; font-size: 24px; }

        .deck-back .card-inner { background: #181818; }
        .deck-back .card-oval { background: #d32f2f; }
        .deck-logo {
            transform: rotate(28deg); color: #fbc02d; font-weight: 900;
            font-size: 18px; text-shadow: 2px 2px 0 #000; letter-spacing: 1px;
        }
        .deck-back { cursor: pointer; }
        .deck-back:active { transform: scale(0.95); }

        /* Всплывающий издевательский стикер по центру экрана */
        #stickerOverlay {
            position: fixed; inset: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center; z-index: 160;
        }
        .sticker-popup {
            background: rgba(0, 0, 0, 0.85); border: 3px solid #f1c40f;
            border-radius: 24px; padding: 18px 28px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: popSticker 2.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
        .sticker-emoji { font-size: 74px; line-height: 1.1; }
        .sticker-title { font-size: 22px; font-weight: 900; color: #f1c40f; margin-top: 4px; text-transform: uppercase; }
        .sticker-sender { font-size: 13px; color: #ccc; margin-top: 6px; }

        @keyframes popSticker {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
            15% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            25% { transform: scale(1) rotate(0deg); opacity: 1; }
            80% { transform: scale(1) opacity: 1; }
            100% { transform: scale(0.7) translateY(-30px); opacity: 0; }
        }

        /* Чат и панель стикеров */
        .chat-box {
            width: 96%; max-width: 440px; margin: 0 auto;
            background: rgba(0,0,0,0.55); border-radius: 10px; padding: 6px 8px;
            display: flex; flex-direction: column; gap: 4px;
        }
        #chatMessages {
            height: 44px; overflow-y: auto; font-size: 12px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .reactions-row {
            display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
        }
        .reactions-row::-webkit-scrollbar { display: none; }
        .sticker-btn {
            flex: 0 0 auto; background: linear-gradient(180deg, #ff5252, #b71c1c);
            border: 1px solid rgba(255,255,255,0.4); border-radius: 8px;
            color: white; font-size: 12px; font-weight: bold;
            padding: 3px 8px; cursor: pointer;
        }
        .sticker-btn:active { transform: scale(0.92); }
        .emoji-btn {
            flex: 0 0 auto; background: rgba(255,255,255,0.15); border: none;
            border-radius: 6px; font-size: 15px; cursor: pointer; padding: 2px 6px;
        }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input-row input {
            flex: 1; padding: 5px 8px; border-radius: 6px; border: none; font-size: 13px;
        }
        .chat-input-row button {
            background: #2ecc71; border: none; border-radius: 6px; padding: 0 12px; font-weight: bold; cursor: pointer;
        }

        /* Нижняя панель игрока и веер карт */
        .bottom-area {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            padding: 4px 0 10px 0;
        }
        #unoBtn {
            background: linear-gradient(45deg, #ff1744, #ff9100); color: white;
            border: 2px solid white; border-radius: 50px; padding: 7px 26px;
            font-size: 15px; font-weight: 900; cursor: pointer; margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(255, 23, 68, 0.5);
        }
        #unoBtn:disabled { background: #444; box-shadow: none; opacity: 0.35; cursor: not-allowed; }

        .hand {
            display: flex; justify-content: center; align-items: flex-end;
            width: 100%; height: 122px; padding: 0 10px;
        }
        .hand .uno-card { cursor: pointer; }
        .hand .uno-card:hover { transform: translateY(-16px) !important; z-index: 50 !important; }

        /* Модальные окна */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            align-items: center; justify-content: center; flex-direction: column; z-index: 150; padding: 20px;
        }
        .color-options { display: flex; gap: 15px; margin-top: 20px; }
        .color-btn { width: 62px; height: 62px; border-radius: 50%; border: 4px solid white; cursor: pointer; }
        .scoreboard-box {
            background: #1c2833; border: 2px solid #f1c40f; border-radius: 16px;
            padding: 20px; width: 100%; max-width: 340px; text-align: center;
        }
        .score-row {
            display: flex; justify-content: space-between; padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="reconnectBanner">🔄 Связь потеряна. Пытаемся переподключиться...</div>
    <button id="soundToggle" onclick="toggleSound()" title="Звук">🔊</button>

    <div id="loginScreen">
        <div class="uno-logo-title">UNO</div>
        <input type="text" id="nameInput" placeholder="Ваше имя" maxlength="14">
        <button class="btn-main" onclick="join()">Войти за стол</button>
    </div>

    <div class="top-bar">
        <div class="round-info" id="roundInfo">Ожидание игроков (2–8 чел.) • Игра до 250 очков</div>
        <div class="players-list" id="playersList"></div>
        <div id="lobbyControls" style="margin-top: 12px; display: none;">
            <button class="btn-main" onclick="startGame()">Начать матч!</button>
        </div>
    </div>

    <div class="center-area" id="gameTable" style="display: none;">
        <div class="direction-indicator" id="dirText">По часовой ➡️</div>
        <div class="table">
            <div class="uno-card deck-back" onclick="drawCard()">
                <div class="card-inner">
                    <div class="card-oval"><span class="deck-logo">UNO</span></div>
                </div>
            </div>
            <div id="topCard"></div>
        </div>
    </div>

    <div id="stickerOverlay"></div>

    <div class="chat-box">
        <div id="chatMessages"></div>
        <div class="reactions-row">
            <button class="sticker-btn" onclick="sendSticker('🤡', 'Клоун!')">🤡 Клоун</button>
            <button class="sticker-btn" onclick="sendSticker('😭', 'Поплачь!')">😭 Поплачь</button>
            <button class="sticker-btn" onclick="sendSticker('🐌', 'Нуб, ходи!')">🐌 Нуб</button>
            <button class="sticker-btn" onclick="sendSticker('💀', 'Тебе конец!')">💀 RIP</button>
            <button class="sticker-btn" onclick="sendSticker('😈', 'Лови +4!')">😈 Лови +4</button>
            <button class="sticker-btn" onclick="sendSticker('🥱', 'Скукота...')">🥱 Скучно</button>
            <button class="emoji-btn" onclick="sendChatEmoji('😂')">😂</button>
            <button class="emoji-btn" onclick="sendChatEmoji('😡')">😡</button>
            <button class="emoji-btn" onclick="sendChatEmoji('🔥')">🔥</button>
            <button class="emoji-btn" onclick="sendChatEmoji('👍')">👍</button>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Написать в чат..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">></button>
        </div>
    </div>

    <div class="bottom-area">
        <button id="unoBtn" onclick="sayUno()" disabled style="display: none;">КРИКНУТЬ УНО!</button>
        <div class="hand" id="hand"></div>
    </div>

    <div id="colorPicker" class="modal-overlay">
        <h2>Выберите цвет:</h2>
        <div class="color-options">
            <div class="color-btn bg-red" onclick="selectColor('red')"></div>
            <div class="color-btn bg-blue" onclick="selectColor('blue')"></div>
            <div class="color-btn bg-green" onclick="selectColor('green')"></div>
            <div class="color-btn bg-yellow" onclick="selectColor('yellow')"></div>
        </div>
    </div>

    <div id="scoreModal" class="modal-overlay">
        <div class="scoreboard-box">
            <h2 id="modalTitle" style="color:#f1c40f; margin-top:0;">Раунд завершен!</h2>
            <p id="modalSubtitle" style="font-size:14px;"></p>
            <div id="standingsList" style="margin: 15px 0;"></div>
            <div id="modalFooter" style="font-size:13px; color:#aaa;">Следующий раунд через 6 сек...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: Infinity
        });

        // Уникальный ID игрока в памяти браузера для возврата при обрыве связи
        let myPlayerId = sessionStorage.getItem('uno_player_id');
        if (!myPlayerId) {
            myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9) + Date.now();
            sessionStorage.setItem('uno_player_id', myPlayerId);
        }
        let savedName = sessionStorage.getItem('uno_player_name') || '';
        if (savedName) document.getElementById('nameInput').value = savedName;

        let isMyTurn = false;
        let wasMyTurn = false;
        let pendingWildIndex = null;
        let currentHand = [];
        let soundEnabled = true;

        // Авто-переподключение при восстановлении сети
        socket.on('connect', () => {
            document.getElementById('reconnectBanner').style.display = 'none';
            const name = sessionStorage.getItem('uno_player_name');
            if (name) {
                socket.emit('joinGame', { name, playerId: myPlayerId });
                document.getElementById('loginScreen').style.display = 'none';
            }
        });

        socket.on('disconnect', () => {
            if (sessionStorage.getItem('uno_player_name')) {
                document.getElementById('reconnectBanner').style.display = 'block';
            }
        });

        // Синтезатор звуков через Web Audio API
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
        }

        function playTone(type) {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'card') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.09);
            } else if (type === 'turn') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.26);
            } else if (type === 'uno') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.start(now); osc.stop(now + 0.46);
            } else if (type === 'penalty') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.36);
                osc.start(now); osc.stop(now + 0.37);
            } else if (type === 'sticker') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(480, now + 0.08);
                osc.frequency.setValueAtTime(260, now + 0.18);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.31);
            } else if (type === 'win') {
                osc.type = 'triangle';
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                });
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.62);
            }
        }

        socket.on('playSound', (type) => playTone(type));

        function join() {
            initAudio();
            const inputVal = document.getElementById('nameInput').value.trim();
            const finalName = inputVal || ('Игрок_' + Math.floor(Math.random() * 90 + 10));
            sessionStorage.setItem('uno_player_name', finalName);
            socket.emit('joinGame', { name: finalName, playerId: myPlayerId });
            document.getElementById('loginScreen').style.display = 'none';
        }

        function startGame() {
            initAudio();
            socket.emit('startGame');
        }

        function createCardHTML(card) {
            const isWild = card.type === 'wild' || card.type === 'wild4';
            const ovalClass = isWild ? 'card-oval wild-oval' : 'card-oval';
            const textClass = isWild ? '' : `txt-${card.color}`;
            return `
                <div class="card-inner bg-${card.color}">
                    <span class="corner-top">${card.value}</span>
                    <div class="${ovalClass}">
                        <span class="card-center-val ${textClass}">${card.value}</span>
                    </div>
                    <span class="corner-bottom">${card.value}</span>
                </div>
            `;
        }

        function renderHand() {
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            const count = currentHand.length;
            if (count === 0) return;

            const screenWidth = window.innerWidth - 20;
            const cardWidth = 78;
            let overlap = 0;

            if (count * cardWidth > screenWidth && count > 1) {
                const visibleStep = (screenWidth - cardWidth) / (count - 1);
                overlap = Math.max(visibleStep - cardWidth, -62);
            }

            currentHand.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'uno-card';
                el.innerHTML = createCardHTML(card);
                if (index > 0 && overlap < 0) {
                    el.style.marginLeft = `${overlap}px`;
                }
                el.style.zIndex = index + 1;
                el.onclick = () => {
                    initAudio();
                    if (!isMyTurn) return;
                    if (card.color === 'black') {
                        pendingWildIndex = index;
                        document.getElementById('colorPicker').style.display = 'flex';
                    } else {
                        socket.emit('playCard', { cardIndex: index });
                    }
                };
                handDiv.appendChild(el);
            });
        }

        window.addEventListener('resize', renderHand);

        socket.on('gameState', (state) => {
            document.getElementById('scoreModal').style.display = 'none';
            isMyTurn = state.isMyTurn;

            if (state.soundEvent) playTone(state.soundEvent);
            if (isMyTurn && !wasMyTurn && state.gameStarted) {
                setTimeout(() => playTone('turn'), 120);
            }
            wasMyTurn = isMyTurn;

            document.getElementById('roundInfo').innerText = state.gameStarted
                ? `Раунд ${state.roundNumber} • Цель: ${state.targetScore} очков`
                : `Лобби (${state.playersList.length}/8 чел.) • Игра до ${state.targetScore} очков`;

            const pList = document.getElementById('playersList');
            pList.innerHTML = '';
            state.playersList.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-badge' +
                    (p.isTurn ? ' active-turn' : '') +
                    (!p.connected ? ' offline' : '');
                div.innerHTML = `
                    <b>${p.name}${p.isMe ? ' (Вы)' : ''}${!p.connected ? ' 🔌' : ''}</b><br>
                    🃏 ${p.count} | 🏆 ${p.score}
                    ${p.saidUno ? '<br><span class="uno-tag">УНО!</span>' : ''}
                `;
                pList.appendChild(div);
            });

            if (!state.gameStarted) {
                document.getElementById('lobbyControls').style.display = state.playersList.length >= 2 ? 'block' : 'none';
                document.getElementById('gameTable').style.display = 'none';
                document.getElementById('unoBtn').style.display = 'none';
                document.getElementById('hand').innerHTML = '';
                return;
            }

            document.getElementById('lobbyControls').style.display = 'none';
            document.getElementById('gameTable').style.display = 'flex';
            document.getElementById('unoBtn').style.display = 'block';

            document.getElementById('dirText').innerText = state.direction === 1
                ? 'По часовой ➡️'
                : 'Против часовой ⬅️';

            const unoBtn = document.getElementById('unoBtn');
            unoBtn.disabled = !(state.hand.length <= 2 && !state.saidUno);
            unoBtn.innerText = state.saidUno ? 'УНО СКАЗАНО!' : 'КРИКНУТЬ УНО!';

            const topCardDiv = document.getElementById('topCard');
            topCardDiv.className = 'uno-card';
            topCardDiv.innerHTML = createCardHTML(state.currentCard);

            currentHand = state.hand;
            renderHand();
        });

        function selectColor(color) {
            document.getElementById('colorPicker').style.display = 'none';
            if (pendingWildIndex !== null) {
                socket.emit('playCard', { cardIndex: pendingWildIndex, chosenColor: color });
                pendingWildIndex = null;
            }
        }

        function drawCard() { initAudio(); if (isMyTurn) socket.emit('drawCard'); }
        function sayUno() { initAudio(); socket.emit('sayUno'); }

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                socket.emit('sendChat', input.value);
                input.value = '';
            }
        }
        function sendChatEmoji(emoji) { socket.emit('sendChat', emoji); }
        function sendSticker(emoji, title) {
            initAudio();
            socket.emit('sendSticker', { emoji, title });
        }

        socket.on('showSticker', ({ sender, sticker }) => {
            playTone('sticker');
            const overlay = document.getElementById('stickerOverlay');
            overlay.innerHTML = `
                <div class="sticker-popup">
                    <div class="sticker-emoji">${sticker.emoji}</div>
                    <div class="sticker-title">${sticker.title}</div>
                    <div class="sticker-sender">от ${sender}</div>
                </div>
            `;
        });

        socket.on('chatMessage', (msg) => {
            const box = document.getElementById('chatMessages');
            const line = document.createElement('div');
            line.innerHTML = msg.isSystem
                ? `<span style="color:#f1c40f">${msg.text}</span>`
                : `<b>${msg.sender}:</b> ${msg.text}`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        });

        socket.on('roundOver', (data) => {
            playTone('win');
            document.getElementById('modalTitle').innerText = `Раунд выиграл ${data.winner}!`;
            document.getElementById('modalSubtitle').innerText = `+${data.roundPoints} очков за карты соперников`;
            document.getElementById('standingsList').innerHTML = data.standings
                .map((p, i) => `<div class="score-row"><span>${i + 1}. ${p.name}</span><b>${p.score} / 250</b></div>`)
                .join('');
            document.getElementById('modalFooter').innerText = `Раунд ${data.nextRound} начнется через 6 секунд...`;
            document.getElementById('scoreModal').style.display = 'flex';
        });

        socket.on('matchOver', (data) => {
            playTone('win');
            document.getElementById('modalTitle').innerText = `🏆 ЧЕМПИОН: ${data.winner}!`;
            document.getElementById('modalSubtitle').innerText = `Набрано 250+ очков (+${data.roundPoints} в финале)`;
            document.getElementById('standingsList').innerHTML = data.standings
                .map((p, i) => `<div class="score-row"><span>${i + 1}. ${p.name}</span><b>${p.score}</b></div>`)
                .join('');
            document.getElementById('modalFooter').innerHTML = `<button class="btn-main" style="margin-top:10px;" onclick="location.reload()">Новая игра</button>`;
            document.getElementById('scoreModal').style.display = 'flex';
        });

        socket.on('alertMsg', (msg) => alert(msg));
        socket.on('errorMsg', (msg) => {
            sessionStorage.removeItem('uno_player_name');
            alert(msg);
            location.reload();
        });
    </script>
</body>
</html>
