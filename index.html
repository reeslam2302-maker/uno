<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Online & Offline</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #1b5e20 0%, #09220b 100%);
            color: white; margin: 0; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            user-select: none; overflow: hidden;
        }

        /* Баннер потери связи */
        #reconnectBanner {
            display: none; position: fixed; top: 0; left: 0; width: 100%;
            background: #e67e22; color: #fff; text-align: center; padding: 6px;
            font-weight: bold; font-size: 13px; z-index: 999;
        }

        /* Экран выбора режима (Лобби старта) */
        #startScreen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; padding: 20px; text-align: center;
        }
        .logo-title {
            font-size: 52px; font-weight: 900; color: #f1c40f;
            text-shadow: 4px 4px 0 #c0392b, -2px -2px 0 #000;
            transform: rotate(-5deg); margin-bottom: 15px;
        }
        .login-card {
            background: #1a252f; padding: 22px; border-radius: 16px;
            border: 2px solid #34495e; width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .login-card input, .login-card select {
            padding: 12px; font-size: 16px; border-radius: 10px;
            border: 2px solid #34495e; background: #2c3e50; color: white; text-align: center;
        }
        .btn-mode {
            padding: 14px; font-size: 17px; font-weight: bold; border: none;
            border-radius: 10px; cursor: pointer; transition: transform 0.1s;
        }
        .btn-mode:active { transform: scale(0.97); }
        .btn-online { background: linear-gradient(45deg, #2ecc71, #27ae60); color: white; }
        .btn-offline { background: linear-gradient(45deg, #f39c12, #d35400); color: white; }
        .offline-box {
            border-top: 1px solid #34495e; padding-top: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        /* Верхняя панель игроков */
        .top-bar { display: flex; flex-direction: column; align-items: center; padding: 8px 6px 0; width: 100%; }
        .top-controls {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 900px; padding: 0 8px 6px; font-size: 13px;
        }
        .mode-badge { background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .icon-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 14px;
        }
        .players-list {
            display: flex; gap: 8px; overflow-x: auto; max-width: 100%;
            padding: 4px 8px; scrollbar-width: none;
        }
        .players-list::-webkit-scrollbar { display: none; }
        .player-badge {
            background: rgba(0,0,0,0.55); padding: 6px 12px; border-radius: 12px;
            border: 2px solid transparent; text-align: center; font-size: 13px;
            white-space: nowrap; flex-shrink: 0;
        }
        .player-badge.active-turn {
            border-color: #f1c40f; background: rgba(241, 196, 15, 0.25);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }
        .uno-tag { background: #e74c3c; padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* Лобби ожидания в онлайне */
        #lobbyControls {
            margin-top: 12px; display: none; flex-wrap: wrap;
            gap: 8px; justify-content: center;
        }
        .btn-small {
            padding: 9px 16px; font-size: 14px; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer;
        }

        /* Игровой стол и оригинальные скины карт */
        .center-area { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .direction-indicator {
            font-size: 12px; background: rgba(0,0,0,0.4);
            padding: 3px 12px; border-radius: 12px;
        }
        .table { display: flex; align-items: center; gap: 22px; }

        .uno-card {
            width: 78px; height: 116px; border-radius: 12px;
            background: #fff; padding: 5px; position: relative;
            box-shadow: 0 6px 14px rgba(0,0,0,0.6);
            transition: transform 0.18s ease; flex-shrink: 0;
        }
        .uno-card-inner {
            width: 100%; height: 100%; border-radius: 8px;
            position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .uno-oval {
            width: 86%; height: 68%; background: white;
            border-radius: 50%; transform: rotate(-28deg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
        }
        .uno-center-val {
            transform: rotate(28deg); font-size: 32px; font-weight: 900;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
        }
        .uno-corner {
            position: absolute; font-size: 13px; font-weight: 900; color: white;
            text-shadow: 1px 1px 0 #000;
        }
        .uno-corner.tl { top: 4px; left: 6px; }
        .uno-corner.br { bottom: 4px; right: 6px; transform: rotate(180deg); }

        .c-red .uno-card-inner { background: #d32f2f; }
        .c-red .uno-center-val { color: #d32f2f; }
        .c-blue .uno-card-inner { background: #1976d2; }
        .c-blue .uno-center-val { color: #1976d2; }
        .c-green .uno-card-inner { background: #388e3c; }
        .c-green .uno-center-val { color: #388e3c; }
        .c-yellow .uno-card-inner { background: #fbc02d; }
        .c-yellow .uno-center-val { color: #fbc02d; }
        .c-black .uno-card-inner { background: #212121; }
        .c-black .uno-oval {
            background: conic-gradient(#d32f2f 0deg 90deg, #1976d2 90deg 180deg, #fbc02d 180deg 270deg, #388e3c 270deg 360deg);
        }
        .c-black .uno-center-val { color: white; font-size: 26px; }

        /* Рубашка колоды */
        .deck-card { cursor: pointer; }
        .deck-card:active { transform: scale(0.95); }
        .deck-card .uno-card-inner { background: #111; }
        .deck-card .uno-oval { background: #d32f2f; border: 3px solid #fbc02d; }
        .deck-logo {
            transform: rotate(28deg); font-size: 19px; font-weight: 900;
            color: #fbc02d; text-shadow: 2px 2px 0 #000; letter-spacing: 1px;
        }

        /* Чат и стикеры */
        .social-panel {
            width: 96%; max-width: 460px; background: rgba(0,0,0,0.55);
            border-radius: 12px; padding: 6px 8px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 5px;
        }
        #chatMessages {
            height: 54px; overflow-y: auto; font-size: 12px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .taunt-bar {
            display: flex; gap: 4px; overflow-x: auto; align-items: center;
            scrollbar-width: none; padding-bottom: 2px;
        }
        .taunt-bar::-webkit-scrollbar { display: none; }
        .taunt-target {
            background: #2c3e50; color: white; border: 1px solid #555;
            border-radius: 6px; padding: 3px 5px; font-size: 11px; flex-shrink: 0;
        }
        .taunt-btn {
            background: rgba(255,255,255,0.14); border: none; border-radius: 6px;
            color: white; font-size: 12px; padding: 3px 7px; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
        }
        .taunt-btn:active { background: rgba(255,255,255,0.35); }
        .chat-row { display: flex; gap: 5px; }
        .chat-row input {
            flex: 1; padding: 5px 8px; border-radius: 6px; border: none;
            font-size: 12px; background: rgba(255,255,255,0.9);
        }
        .chat-row button {
            background: #2ecc71; border: none; border-radius: 6px;
            padding: 0 12px; font-weight: bold; cursor: pointer;
        }

        /* Всплывающий баннер стикера по центру экрана */
        #tauntOverlay {
            display: none; position: fixed; top: 38%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0,0,0,0.88); border: 3px solid #f1c40f;
            border-radius: 20px; padding: 16px 28px; text-align: center;
            z-index: 300; pointer-events: none;
            animation: popTaunt 2.6s ease forwards;
        }
        @keyframes popTaunt {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
        }

        /* Нижняя панель игрока и веер карт */
        .bottom-area {
            display: flex; flex-direction: column; align-items: center;
            padding-bottom: 10px; width: 100%;
        }
        #unoBtn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white;
            border: 3px solid white; border-radius: 50px; padding: 8px 28px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-bottom: 8px;
            box-shadow: 0 4px 12px rgba(255, 65, 108, 0.5);
        }
        #unoBtn:disabled { background: #555; box-shadow: none; opacity: 0.4; cursor: not-allowed; }

        .hand-wrapper {
            width: 100%; height: 126px; display: flex;
            justify-content: center; align-items: flex-end; padding: 0 10px;
        }
        .hand { display: flex; align-items: flex-end; justify-content: center; position: relative; }
        .hand .uno-card { cursor: pointer; }
        .hand .uno-card:hover { transform: translateY(-16px) !important; z-index: 50 !important; }

        /* Модальные окна (выбор цвета и итоги раунда) */
        .modal-bg {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            align-items: center; justify-content: center; flex-direction: column;
            z-index: 250; padding: 20px; text-align: center;
        }
        .color-options { display: flex; gap: 15px; margin-top: 20px; }
        .color-btn { width: 62px; height: 62px; border-radius: 50%; border: 4px solid white; cursor: pointer; }
        .score-box {
            background: #1a252f; padding: 22px; border-radius: 16px;
            border: 2px solid #f1c40f; width: 100%; max-width: 340px;
        }
    </style>
</head>
<body>

    <div id="reconnectBanner">🔌 Связь потеряна. Возвращаем вас за стол...</div>

    <!-- Главный экран выбора режима -->
    <div id="startScreen">
        <div class="logo-title">UNO</div>
        <div class="login-card">
            <input type="text" id="nameInput" placeholder="Ваше имя (например: Ринат)" maxlength="15">
            
            <button class="btn-mode btn-online" onclick="startOnline()">🌐 Онлайн с друзьями</button>
            
            <div class="offline-box">
                <div style="font-size: 13px; color: #bdc3c7;">Или сыграйте в одиночку без сети:</div>
                <select id="botCountSelect">
                    <option value="1">1 бот (дуэль 1 на 1)</option>
                    <option value="2">2 бота (стол на 3)</option>
                    <option value="3" selected>3 бота (классика на 4)</option>
                    <option value="4">4 бота (стол на 5)</option>
                    <option value="5">5 ботов (стол на 6)</option>
                    <option value="7">7 ботов (максимум на 8)</option>
                </select>
                <button class="btn-mode btn-offline" onclick="startOffline()">🤖 Офлайн против ботов</button>
            </div>
        </div>
    </div>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="top-controls">
            <span class="mode-badge" id="modeLabel">Режим</span>
            <div style="display: flex; gap: 6px;">
                <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊 Звук</button>
                <button class="icon-btn" onclick="exitToMenu()">🚪 Выход</button>
            </div>
        </div>
        <div class="players-list" id="playersList"></div>

        <div id="lobbyControls">
            <button class="btn-small" style="background:#2ecc71; color:#000;" onclick="socket.emit('startGame')">▶ Начать матч</button>
            <button class="btn-small" style="background:#3498db; color:#fff;" onclick="socket.emit('addBot')">+ Бот 🤖</button>
            <button class="btn-small" style="background:#e74c3c; color:#fff;" onclick="socket.emit('removeBots')">Убрать ботов</button>
        </div>
    </div>

    <!-- Игровой стол -->
    <div class="center-area" id="gameTable" style="display: none;">
        <div class="direction-indicator" id="dirText">По часовой ➡️</div>
        <div class="table">
            <div class="uno-card deck-card" onclick="handleDrawClick()">
                <div class="uno-card-inner">
                    <div class="uno-oval"><span class="deck-logo">UNO</span></div>
                </div>
            </div>
            <div id="topCard"></div>
        </div>
    </div>

    <!-- Чат и стикеры -->
    <div class="social-panel" id="socialPanel" style="display: none;">
        <div id="chatMessages"></div>
        <div class="taunt-bar">
            <select id="tauntTarget" class="taunt-target">
                <option value="all">Всем</option>
            </select>
            <button class="taunt-btn" onclick="sendTaunt('🤡 Клоун!')">🤡 Клоун</button>
            <button class="taunt-btn" onclick="sendTaunt('😭 Поплачь!')">😭 Поплачь</button>
            <button class="taunt-btn" onclick="sendTaunt('🐌 Нуб!')">🐌 Нуб</button>
            <button class="taunt-btn" onclick="sendTaunt('💀 RIP')">💀 RIP</button>
            <button class="taunt-btn" onclick="sendTaunt('🥱 Скучно...')">🥱 Скучно</button>
            <button class="taunt-btn" onclick="sendTaunt('🔥 Красава!')">🔥 Красава</button>
        </div>
        <div class="chat-row" id="chatInputRow">
            <input type="text" id="chatInput" placeholder="Написать в чат..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">➤</button>
        </div>
    </div>

    <!-- Нижняя панель игрока -->
    <div class="bottom-area">
        <button id="unoBtn" onclick="handleUnoClick()" disabled style="display: none;">КРИКНУТЬ УНО!</button>
        <div class="hand-wrapper">
            <div class="hand" id="hand"></div>
        </div>
    </div>

    <!-- Всплывающий стикер -->
    <div id="tauntOverlay">
        <div id="tauntFrom" style="font-size: 13px; color: #f1c40f; margin-bottom: 4px;"></div>
        <div id="tauntText" style="font-size: 30px; font-weight: 900;"></div>
    </div>

    <!-- Выбор цвета -->
    <div class="modal-bg" id="colorPicker">
        <h2>Выберите цвет:</h2>
        <div class="color-options">
            <div class="color-btn" style="background:#d32f2f" onclick="confirmColor('red')"></div>
            <div class="color-btn" style="background:#1976d2" onclick="confirmColor('blue')"></div>
            <div class="color-btn" style="background:#388e3c" onclick="confirmColor('green')"></div>
            <div class="color-btn" style="background:#fbc02d" onclick="confirmColor('yellow')"></div>
        </div>
    </div>

    <!-- Таблица очков -->
    <div class="modal-bg" id="scoreModal">
        <div class="score-box">
            <h2 id="scoreTitle" style="color:#f1c40f; margin-top:0;">Раунд окончен!</h2>
            <div id="scoreSubtitle" style="margin-bottom:12px; font-size:14px;"></div>
            <div id="scoreList" style="text-align:left; margin-bottom:16px; line-height:1.7;"></div>
            <button id="scoreNextBtn" class="btn-mode btn-online" style="width:100%; display:none;" onclick="nextOfflineRound()">Следующий раунд</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ autoConnect: false });
        let gameMode = null; // 'online' или 'offline'
        let soundEnabled = true;
        let isMyTurn = false;
        let pendingWildIndex = null;

        // Уникальный ID игрока для автовозврата в онлайн
        let myUid = localStorage.getItem('uno_uid');
        if (!myUid) {
            myUid = 'u_' + Math.random().toString(36).slice(2, 11);
            localStorage.setItem('uno_uid', myUid);
        }
        const savedName = localStorage.getItem('uno_name');
        if (savedName) document.getElementById('nameInput').value = savedName;

        // Предзагрузка ваших MP3 файлов
        const customAudio = {
            plus2: new Audio('plus2.mp3'),
            plus4: new Audio('plus4.mp3'),
            uno: new Audio('uno.mp3'),
            wild: new Audio('wild.mp3')
        };

        function unlockAudio() {
            Object.values(customAudio).forEach(a => {
                a.volume = 0.85;
                a.load();
            });
        }

        function playSound(type) {
            if (!soundEnabled) return;
            if (customAudio[type]) {
                customAudio[type].currentTime = 0;
                customAudio[type].play().catch(() => {});
                return;
            }
            // Легкий синтезатор для обычного хода и взятия карты
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = type === 'draw' ? 280 : 460;
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊 Звук' : '🔇 Без звука';
        }

        function exitToMenu() {
            location.reload();
        }

        // Отрисовка оригинальной карты UNO
        function createCardHTML(card) {
            return `
                <div class="uno-card c-${card.color}">
                    <div class="uno-card-inner">
                        <span class="uno-corner tl">${card.value}</span>
                        <div class="uno-oval">
                            <span class="uno-center-val">${card.value}</span>
                        </div>
                        <span class="uno-corner br">${card.value}</span>
                    </div>
                </div>
            `;
        }

        // Адаптивный веер карт под ширину экрана телефона
        function renderHand(hand) {
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            const count = hand.length;
            if (count === 0) return;

            const screenW = window.innerWidth - 24;
            const cardW = 78;
            let overlap = 0;
            if (count * cardW > screenW && count > 1) {
                const visibleStep = (screenW - cardW) / (count - 1);
                overlap = Math.max(visibleStep - cardW, -58);
            }

            hand.forEach((card, idx) => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = createCardHTML(card).trim();
                const cardEl = wrapper.firstChild;
                if (idx > 0 && overlap < 0) {
                    cardEl.style.marginLeft = `${overlap}px`;
                }
                cardEl.style.zIndex = idx + 1;
                cardEl.onclick = () => onCardClick(card, idx);
                handDiv.appendChild(cardEl);
            });
        }

        function showTaunt(from, text, isPrivate) {
            const overlay = document.getElementById('tauntOverlay');
            document.getElementById('tauntFrom').innerText = isPrivate ? `Лично от ${from}:` : `${from} говорит:`;
            document.getElementById('tauntText').innerText = text;
            overlay.style.display = 'none';
            void overlay.offsetWidth;
            overlay.style.display = 'block';
        }

        function addChatLine(sender, text, isSystem) {
            const box = document.getElementById('chatMessages');
            const line = document.createElement('div');
            line.innerHTML = isSystem
                ? `<span style="color:#f1c40f">${text}</span>`
                : `<b>${sender}:</b> ${text}`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        }

        // ================= ОНЛАЙН РЕЖИМ =================
        function startOnline() {
            const name = document.getElementById('nameInput').value.trim() || 'Игрок';
            localStorage.setItem('uno_name', name);
            unlockAudio();

            gameMode = 'online';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('modeLabel').innerText = '🌐 Онлайн';
            document.getElementById('socialPanel').style.display = 'flex';

            socket.connect();
            socket.emit('joinOnline', { uid: myUid, name });
        }

        socket.on('disconnect', () => {
            if (gameMode === 'online') document.getElementById('reconnectBanner').style.display = 'block';
        });

        socket.on('connect', () => {
            document.getElementById('reconnectBanner').style.display = 'none';
            if (gameMode === 'online') {
                const name = localStorage.getItem('uno_name') || 'Игрок';
                socket.emit('joinOnline', { uid: myUid, name });
            }
        });

        socket.on('gameState', (state) => {
            if (gameMode !== 'online') return;
            isMyTurn = state.isMyTurn;
            if (state.soundEvent) playSound(state.soundEvent);

            updatePlayersUI(state.playersList);

            if (!state.gameStarted) {
                document.getElementById('lobbyControls').style.display = 'flex';
                document.getElementById('gameTable').style.display = 'none';
                document.getElementById('unoBtn').style.display = 'none';
                return;
            }

            document.getElementById('lobbyControls').style.display = 'none';
            document.getElementById('gameTable').style.display = 'flex';
            document.getElementById('unoBtn').style.display = 'block';

            document.getElementById('dirText').innerText = state.direction === 1 ? 'По часовой ➡️' : 'Против часовой ⬅️';
            document.getElementById('topCard').innerHTML = createCardHTML(state.currentCard);

            const unoBtn = document.getElementById('unoBtn');
            unoBtn.disabled = !(state.hand.length <= 2 && !state.saidUno);
            unoBtn.innerText = state.saidUno ? 'УНО СКАЗАНО!' : 'КРИКНУТЬ УНО!';

            renderHand(state.hand);
        });

        function updatePlayersUI(list) {
            const pList = document.getElementById('playersList');
            const targetSel = document.getElementById('tauntTarget');
            const prevTarget = targetSel.value;

            pList.innerHTML = '';
            targetSel.innerHTML = '<option value="all">Всем</option>';

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-badge' + (p.isTurn ? ' active-turn' : '');
                const connIcon = p.disconnected ? '🔌 ' : '';
                div.innerHTML = `<b>${connIcon}${p.name}${p.isMe ? ' (Вы)' : ''}</b><br>` +
                                `Карт: ${p.count} | Очки: ${p.score} ` +
                                (p.saidUno ? '<span class="uno-tag">УНО!</span>' : '');
                pList.appendChild(div);

                if (!p.isMe) {
                    const opt = document.createElement('option');
                    opt.value = p.uid;
                    opt.innerText = p.name;
                    targetSel.appendChild(opt);
                }
            });
            if ([...targetSel.options].some(o => o.value === prevTarget)) targetSel.value = prevTarget;
        }

        socket.on('chatMessage', (m) => addChatLine(m.sender, m.text, m.isSystem));
        socket.on('tauntPopup', (t) => showTaunt(t.from, t.text, t.isPrivate));
        socket.on('alertMsg', (msg) => alert(msg));
        socket.on('errorMsg', (msg) => { alert(msg); location.reload(); });

        socket.on('roundOver', (data) => {
            showScoreModal(`Раунд взял: ${data.winner}!`, `+${data.points} очков за раунд`, data.scores, false);
            setTimeout(() => { document.getElementById('scoreModal').style.display = 'none'; }, 4300);
        });

        socket.on('matchOver', (data) => {
            showScoreModal(`🏆 Чемпион: ${data.winner}!`, 'Достигнут лимит 250 очков!', data.scores, false);
            setTimeout(() => location.reload(), 6000);
        });

        function showScoreModal(title, subtitle, scores, showBtn) {
            document.getElementById('scoreTitle').innerText = title;
            document.getElementById('scoreSubtitle').innerText = subtitle;
            document.getElementById('scoreList').innerHTML = scores
                .sort((a, b) => b.score - a.score)
                .map(s => `<div>• <b>${s.name}</b>: ${s.score} очков</div>`).join('');
            document.getElementById('scoreNextBtn').style.display = showBtn ? 'block' : 'none';
            document.getElementById('scoreModal').style.display = 'flex';
        }

        // ================= ОФЛАЙН РЕЖИМ (ЛОКАЛЬНЫЙ ДВИЖОК) =================
        let offPlayers = [];
        let offDeck = [];
        let offTopCard = null;
        let offTurn = 0;
        let offDir = 1;
        let offTimer = null;

        function startOffline() {
            const name = document.getElementById('nameInput').value.trim() || 'Вы';
            const botCount = parseInt(document.getElementById('botCountSelect').value, 10);
            localStorage.setItem('uno_name', name);
            unlockAudio();

            gameMode = 'offline';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('modeLabel').innerText = `🤖 Офлайн (${botCount} ботов)`;
            document.getElementById('gameTable').style.display = 'flex';
            document.getElementById('unoBtn').style.display = 'block';
            document.getElementById('socialPanel').style.display = 'flex';
            document.getElementById('chatInputRow').style.display = 'none';

            const names = ['Терминатор 🤖', 'Альтрон 🤖', 'Валли 🤖', 'R2-D2 🤖', 'Бендер 🤖', 'Джарвис 🤖', 'Скайнет 🤖'];
            offPlayers = [{ uid: 'me', name, hand: [], score: 0, saidUno: false, isBot: false, isMe: true }];
            for (let i = 0; i < botCount; i++) {
                offPlayers.push({ uid: 'b' + i, name: names[i], hand: [], score: 0, saidUno: false, isBot: true, isMe: false });
            }
            nextOfflineRound();
        }

        function buildOfflineDeck() {
            const cols = ['red', 'blue', 'green', 'yellow'];
            offDeck = [];
            for (let c of cols) {
                offDeck.push({ color: c, value: '0', type: 'number' });
                for (let n = 1; n <= 9; n++) {
                    offDeck.push({ color: c, value: String(n), type: 'number' });
                    offDeck.push({ color: c, value: String(n), type: 'number' });
                }
                for (let k = 0; k < 2; k++) {
                    offDeck.push({ color: c, value: '+2', type: 'draw2' });
                    offDeck.push({ color: c, value: '🚫', type: 'skip' });
                    offDeck.push({ color: c, value: '🔄', type: 'reverse' });
                }
            }
            for (let k = 0; k < 4; k++) {
                offDeck.push({ color: 'black', value: '🌈', type: 'wild' });
                offDeck.push({ color: 'black', value: '+4', type: 'wild4' });
            }
            offDeck.sort(() => Math.random() - 0.5);
        }

        function drawOff(cnt) {
            let res = [];
            for (let i = 0; i < cnt; i++) {
                if (offDeck.length === 0) buildOfflineDeck();
                res.push(offDeck.pop());
            }
            return res;
        }

        function nextOfflineRound() {
            document.getElementById('scoreModal').style.display = 'none';
            buildOfflineDeck();
            offDir = 1;
            offTurn = 0;
            offPlayers.forEach(p => { p.hand = drawOff(7); p.saidUno = false; });
            do { offTopCard = offDeck.pop(); } while (offTopCard.color === 'black');
            renderOffline();
        }

        function renderOffline() {
            isMyTurn = (offTurn === 0);
            updatePlayersUI(offPlayers.map((p, idx) => ({
                uid: p.uid, name: p.name, count: p.hand.length,
                score: p.score, saidUno: p.saidUno, isTurn: idx === offTurn, isMe: p.isMe
            })));

            document.getElementById('dirText').innerText = offDir === 1 ? 'По часовой ➡️' : 'Против часовой ⬅️';
            document.getElementById('topCard').innerHTML = createCardHTML(offTopCard);

            const me = offPlayers[0];
            const unoBtn = document.getElementById('unoBtn');
            unoBtn.disabled = !(me.hand.length <= 2 && !me.saidUno);
            unoBtn.innerText = me.saidUno ? 'УНО СКАЗАНО!' : 'КРИКНУТЬ УНО!';

            renderHand(me.hand);

            if (offPlayers[offTurn].isBot) {
                if (offTimer) clearTimeout(offTimer);
                offTimer = setTimeout(botStepOffline, 1200);
            }
        }

        function nextOffIdx(step = 1) {
            const len = offPlayers.length;
            return (offTurn + step * offDir + len * 100) % len;
        }

        function playOffCard(pIdx, cIdx, chosenCol) {
            const p = offPlayers[pIdx];
            const card = p.hand[cIdx];
            p.hand.splice(cIdx, 1);
            offTopCard = { ...card };

            let snd = 'play';
            if (card.color === 'black') {
                offTopCard.color = chosenCol || 'red';
                if (card.type === 'wild') snd = 'wild';
            }

            if (p.hand.length === 0) {
                if (!p.saidUno && !p.isBot) {
                    p.hand.push(...drawOff(2));
                    alert('Вы забыли нажать УНО! Штраф +2 карты.');
                } else {
                    let pts = 0;
                    offPlayers.forEach((pl, i) => {
                        if (i !== pIdx) {
                            pts += pl.hand.reduce((s, c) => s + (c.type === 'number' ? +c.value : (c.color === 'black' ? 50 : 20)), 0);
                        }
                    });
                    p.score += pts;
                    if (p.score >= 250) {
                        showScoreModal(`🏆 Победитель: ${p.name}!`, 'Набрано 250 очков!', offPlayers, false);
                        setTimeout(() => location.reload(), 5000);
                    } else {
                        showScoreModal(`Раунд взял: ${p.name}!`, `+${pts} очков`, offPlayers, true);
                    }
                    return;
                }
            }

            if (p.hand.length > 1) p.saidUno = false;
            const victim = offPlayers[nextOffIdx(1)];

            if (card.type === 'reverse') {
                offTurn = offPlayers.length === 2 ? nextOffIdx(2) : (offDir *= -1, nextOffIdx(1));
            } else if (card.type === 'skip') {
                offTurn = nextOffIdx(2);
            } else if (card.type === 'draw2') {
                snd = 'plus2';
                victim.hand.push(...drawOff(2));
                victim.saidUno = false;
                if (victim.isMe) showTaunt(p.name, '😈 Лови +2!', true);
                offTurn = nextOffIdx(2);
            } else if (card.type === 'wild4') {
                snd = 'plus4';
                victim.hand.push(...drawOff(4));
                victim.saidUno = false;
                if (victim.isMe) showTaunt(p.name, '💀 Лови +4!', true);
                offTurn = nextOffIdx(2);
            } else {
                offTurn = nextOffIdx(1);
            }

            playSound(snd);
            renderOffline();
        }

        function botStepOffline() {
            const bot = offPlayers[offTurn];
            if (!bot || !bot.isBot) return;
            const valid = [];
            bot.hand.forEach((c, i) => {
                if (c.color === 'black' || c.color === offTopCard.color || c.value === offTopCard.value) valid.push(i);
            });
            if (valid.length > 0) {
                valid.sort((a, b) => (bot.hand[a].color === 'black' ? 1 : -1));
                const idx = valid[0];
                const card = bot.hand[idx];
                let col = 'red';
                if (card.color === 'black') {
                    const cnt = { red: 0, blue: 0, green: 0, yellow: 0 };
                    bot.hand.forEach(c => { if (cnt[c.color] !== undefined) cnt[c.color]++; });
                    col = Object.keys(cnt).reduce((a, b) => cnt[a] > cnt[b] ? a : b);
                }
                if (bot.hand.length === 2) {
                    bot.saidUno = true;
                    addChatLine('Система', `🔥 ${bot.name} кричит УНО!`, true);
                    playSound('uno');
                }
                playOffCard(offTurn, idx, col);
            } else {
                bot.hand.push(...drawOff(1));
                bot.saidUno = false;
                offTurn = nextOffIdx(1);
                playSound('draw');
                renderOffline();
            }
        }

        // ================= ОБЩИЕ ДЕЙСТВИЯ ИГРОКА =================
        function onCardClick(card, index) {
            if (!isMyTurn) return;
            const top = gameMode === 'offline' ? offTopCard : null;
            if (gameMode === 'offline') {
                const ok = card.color === 'black' || card.color === top.color || card.value === top.value;
                if (!ok) return;
            }
            if (card.color === 'black') {
                pendingWildIndex = index;
                document.getElementById('colorPicker').style.display = 'flex';
            } else {
                if (gameMode === 'online') socket.emit('playCard', { cardIndex: index });
                else playOffCard(0, index, null);
            }
        }

        function confirmColor(color) {
            document.getElementById('colorPicker').style.display = 'none';
            if (pendingWildIndex === null) return;
            if (gameMode === 'online') socket.emit('playCard', { cardIndex: pendingWildIndex, chosenColor: color });
            else playOffCard(0, pendingWildIndex, color);
            pendingWildIndex = null;
        }

        function handleDrawClick() {
            if (!isMyTurn) return;
            if (gameMode === 'online') {
                socket.emit('drawCard');
            } else {
                offPlayers[0].hand.push(...drawOff(1));
                offPlayers[0].saidUno = false;
                offTurn = nextOffIdx(1);
                playSound('draw');
                renderOffline();
            }
        }

        function handleUnoClick() {
            if (gameMode === 'online') {
                socket.emit('sayUno');
            } else if (offPlayers[0].hand.length <= 2) {
                offPlayers[0].saidUno = true;
                playSound('uno');
                addChatLine('Система', '🔥 Вы крикнули УНО!', true);
                renderOffline();
            }
        }

        function sendChat() {
            const inp = document.getElementById('chatInput');
            if (inp.value.trim() && gameMode === 'online') {
                socket.emit('sendChat', inp.value);
                inp.value = '';
            }
        }

        function sendTaunt(text) {
            const targetUid = document.getElementById('tauntTarget').value;
            if (gameMode === 'online') {
                socket.emit('sendTaunt', { targetUid, text });
            } else {
                addChatLine('Вы', `Отправили стикер «${text}»`, true);
            }
        }

        window.addEventListener('resize', () => {
            if (gameMode === 'offline' && offPlayers[0]) renderHand(offPlayers[0].hand);
        });
    </script>
</body>
</html>
